<div>
  <h1>Contracts</h1>
  <button mat-raised-button color="primary" (click)="addContract()">Add Contract</button>
  <table mat-table [dataSource]="contracts" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let contract"> {{contract.id}} </td>
    </ng-container>
    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef> Customer </th>
      <td mat-cell *matCellDef="let contract"> {{contract.customer}} </td>
    </ng-container>
    <ng-container matColumnDef="contract">
      <th mat-header-cell *matHeaderCellDef> Contract </th>
      <td mat-cell *matCellDef="let contract"> {{contract.contract}} </td>
    </ng-container>
    <ng-container matColumnDef="wbs">
      <th mat-header-cell *matHeaderCellDef> WBS </th>
      <td mat-cell *matCellDef="let contract"> {{contract.wbs}} </td>
    </ng-container>
    <ng-container matColumnDef="projectName">
      <th mat-header-cell *matHeaderCellDef> Project Name </th>
      <td mat-cell *matCellDef="let contract"> {{contract.projectName}} </td>
    </ng-container>
    <ng-container matColumnDef="area">
      <th mat-header-cell *matHeaderCellDef> Area </th>
      <td mat-cell *matCellDef="let contract"> {{contract.area}} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let contract">
        <button mat-button (click)="editContract(contract)">Edit</button>
        <button mat-button (click)="deleteContract(contract.id)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
