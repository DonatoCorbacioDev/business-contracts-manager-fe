<div class="image-container">
  <img src="assets/dashboard1.jpg" alt="Business Meeting Image" onerror="this.src='assets/error1.png'">
  <div *ngIf="manager && role" class="welcome-overlay">
    <div class="welcome-container">

      <p>Your role is: {{ role.role }}</p>
    </div>
  </div>
</div>
