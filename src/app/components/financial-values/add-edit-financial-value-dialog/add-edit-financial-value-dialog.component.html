<h1 mat-dialog-title>{{ isEdit ? 'Edit Financial Value' : 'Add Financial Value' }}</h1>
<div mat-dialog-content>
  <form [formGroup]="financialValueForm">
    <mat-form-field>
      <mat-label>Month</mat-label>
      <mat-select formControlName="month">
        <mat-option *ngFor="let month of months" [value]="month">{{ month }}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Year</mat-label>
      <mat-select formControlName="year">
        <mat-option *ngFor="let year of years" [value]="year">{{ year }}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Value</mat-label>
      <input matInput formControlName="value">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Financial Type</mat-label>
      <mat-select formControlName="financialTypeId">
        <mat-option *ngFor="let type of financialTypes" [value]="type.id">
          {{ type.value }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Area</mat-label>
      <mat-select formControlName="areaId">
        <mat-option *ngFor="let area of areas" [value]="area.id">
          {{ area.value }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button (click)="onSave()">Save</button>
</div>
