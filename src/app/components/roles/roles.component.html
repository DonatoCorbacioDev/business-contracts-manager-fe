<div class="roles-container">
  <h1>Roles</h1>
  <div class="controls">
    <button mat-raised-button color="primary" (click)="addRole()">Add Role</button>
  </div>
  <div class="table-container">
    <table mat-table [dataSource]="roles" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let role"> {{role.id}} </td>
      </ng-container>
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> Role </th>
        <td mat-cell *matCellDef="let role"> {{role.role}} </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let role">
          <button mat-button (click)="editRole(role)">Edit</button>
          <button mat-button (click)="deleteRole(role.id)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
