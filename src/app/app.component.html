<mat-toolbar color="primary" class="main-toolbar">
  <span class="app-title">Business Contracts Manager</span>
  <span class="spacer"></span>
  <button *ngIf="!isAuthenticated()" mat-button routerLink="/login" class="toolbar-button">
    <mat-icon>login</mat-icon>
    <span class="button-text">Login</span>
  </button>
  <ng-container *ngIf="isAuthenticated()">
    <button mat-button routerLink="/home" class="toolbar-button">
      <mat-icon>home</mat-icon>
      <span class="button-text">Home</span>
    </button>
    <button mat-button routerLink="/contracts-select-view" class="toolbar-button">
      <mat-icon>description</mat-icon>
      <span class="button-text">Contracts</span>
    </button>
    <button mat-button routerLink="/financial-values" class="toolbar-button">
      <mat-icon>account_balance_wallet</mat-icon>
      <span class="button-text">Financial Values</span>
    </button>
    <ng-container *ngIf="isAdmin()">
      <button mat-button routerLink="/area" class="toolbar-button">
        <mat-icon>location_on</mat-icon>
        <span class="button-text">Area</span>
      </button>
      <button mat-button routerLink="/financial-types" class="toolbar-button">
        <mat-icon>category</mat-icon>
        <span class="button-text">Financial Types</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item routerLink="/managers">
          <mat-icon>people</mat-icon>
          <span class="button-text">Users</span>
        </button>
        <button mat-menu-item routerLink="/users">
          <mat-icon>supervised_user_circle</mat-icon>
          <span class="button-text">Access</span>
        </button>
        <button mat-menu-item routerLink="/roles">
          <mat-icon>admin_panel_settings</mat-icon>
          <span class="button-text">Roles</span>
        </button>
      </mat-menu>
      <button mat-button [matMenuTriggerFor]="userMenu" class="toolbar-button">
        <mat-icon>settings</mat-icon>
        <span class="button-text">Users Configuration</span>
      </button>
    </ng-container>
    <button mat-button (click)="logout()" class="toolbar-button">
      <mat-icon>logout</mat-icon>
      <span class="button-text">Logout</span>
    </button>
  </ng-container>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
